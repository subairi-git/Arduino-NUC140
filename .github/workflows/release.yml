name: Build Arduino Boards Manager release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create core archive and package index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_release.py
      - name: Verify core archive and index
        run: python scripts/verify_package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="RELEASE_NOTES-v${VERSION}.md"
          if test -f "${NOTES}"; then
            gh release create "${GITHUB_REF_NAME}" "dist/nuc140-${VERSION}.tar.gz" \
              --title "${GITHUB_REF_NAME}" --notes-file "${NOTES}" --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" "dist/nuc140-${VERSION}.tar.gz" \
              --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
      - name: Commit generated index to default branch
        run: |
          git fetch origin main
          git checkout -B publish-index origin/main
          cp dist/package_nuc140_index.json package_nuc140_index.json
          git add package_nuc140_index.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish NUC140 Boards Manager ${GITHUB_REF_NAME} index" || exit 0
          git push origin HEAD:main
