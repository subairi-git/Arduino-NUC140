name: Inventory Nuvoton NuMaker UNO official core
on:
  push:
    branches: ["feature/numaker-nuc140-port"]
    paths:
      - ".github/workflows/numaker-source-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-official-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check candidate NUC140 pin map
        run: python scripts/check_candidate_pinmap.py
      - name: Download pinned NuMaker UNO archive and inventory paths only
        run: python scripts/inventory_numaker.py
      - name: Commit generated inventory on development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/NUMAKER_OFFICIAL_INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m "Document official NuMaker UNO archive source layout"
            git push origin HEAD:feature/numaker-nuc140-port
          fi
